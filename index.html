      <div class="static-intro">
        <h1>UP RUN: Development vs. Gundaraj</h1>
        <p>A fan-made, pro-BJP political satire runner set in a fictionalised Uttar Pradesh. This page is a 3D game, so it needs JavaScript and WebGL: please enable JavaScript, or open it in a current Chrome, Edge, Firefox or Safari.</p>
        <p><b>What is inside:</b> 8 campaign levels (Expressway, Ayodhya, Airport, Kisan, Jan Kalyan, Law &amp; Order, Startup UP, Viksit UP) with stars, badges and a Ribbon Race finish; Accountability Gates (quiz questions answered by choosing a lane, with sourced facts); Rivalry Mode with a stylised-bulldozer Governance Showdown; a Development Race; and Manifesto Mayhem, where a cycle-copter drops crates of fictional promises.</p>
        <p><b>Controls:</b> swipe or use the arrow keys / A D to change lanes, Space / ↑ to jump, ↓ / S to slide, Esc to pause.</p>
        <p>Characters are cartoon caricatures; all dialogue and slogans are written for the game (no real quotes); game scores are fictional. Real-world information is labelled verified fact, government-reported or political claim, with sources. Not an official app; not affiliated with the BJP, the SP, the Government of Uttar Pradesh or any politician.</p>
      </div>
